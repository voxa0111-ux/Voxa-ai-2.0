<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxa AI Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f0f12; color: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #18181c; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a30; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-title { font-size: 1.3rem; font-weight: 700; background: linear-gradient(45deg, #0084ff, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        select { background: #24242c; color: #00d4ff; border: 1px solid #3a3a45; padding: 7px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; outline: none; }
        .icon-btn { background: #24242c; color: #fff; border: 1px solid #3a3a45; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .icon-btn:hover { background: #32323e; color: #ff4d4d; }
        #chat { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .user-wrapper { align-self: flex-end; }
        .bot-wrapper { align-self: flex-start; }
        .msg { padding: 12px 18px; border-radius: 16px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
        .user { background: linear-gradient(135deg, #0084ff, #0055ff); color: white; border-bottom-right-radius: 4px; }
        .bot { background: #1e1e24; color: #e1e1e6; border: 1px solid #2d2d38; border-bottom-left-radius: 4px; }
        .msg-actions { display: flex; gap: 8px; margin-top: 5px; }
        .action-btn { background: none; border: none; color: #a0a0b0; font-size: 0.8rem; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        .action-btn:hover { color: #00d4ff; background: #2a2a35; }
        #input-box { display: flex; padding: 15px 20px; background: #18181c; gap: 10px; border-top: 1px solid #2a2a30; align-items: center; }
        input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #3a3a45; background: #24242c; color: #fff; font-size: 0.95rem; outline: none; }
        input:focus { border-color: #0084ff; }
        .mic-btn { background: #24242c; color: #00d4ff; border: 1px solid #3a3a45; width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .mic-btn.recording { background: #ff4d4d; color: white; }
        .send-btn { background: linear-gradient(45deg, #0084ff, #00d4ff); color: #fff; border: none; padding: 0 22px; height: 45px; border-radius: 25px; font-weight: bold; cursor: pointer; }
        pre { background: #121215; padding: 10px; border-radius: 8px; overflow-x: auto; margin-top: 8px; border: 1px solid #333; }
    </style>
</head>
<body>
    <header>
        <div class="logo-area">
            <i class="fa-solid fa-robot" style="color: #0084ff; font-size: 1.4rem;"></i>
            <span class="logo-title">Voxa AI Pro</span>
        </div>
        <div class="header-actions">
            <select id="model">
                <option value="groq">⚡ Groq</option>
                <option value="gemini-3.6">✨ Gemini 3.6</option>
                <option value="gemini-3.5">✨ Gemini 3.5</option>
                <option value="gemini-lite">💨 Gemini Lite</option>
            </select>
            <button class="icon-btn" onclick="clearChat()"><i class="fa-solid fa-trash"></i></button>
        </div>
    </header>

    <div id="chat">
        <div class="msg-wrapper bot-wrapper">
            <div class="msg bot">Namaste! Main <b>Voxa AI Pro</b> hoon. Keys ab safe hain. Kya help chahiye?</div>
        </div>
    </div>

    <div id="input-box">
        <button class="mic-btn" id="micBtn" onclick="toggleVoiceInput()">
            <i class="fa-solid fa-microphone"></i>
        </button>
        <input type="text" id="userInput" placeholder="Voxa se kuch pucho..." onkeypress="if(event.key==='Enter') send()">
        <button class="send-btn" onclick="send()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <script>
        async function send() {
            const input = document.getElementById("userInput");
            const chat = document.getElementById("chat");
            const text = input.value.trim();
            const model = document.getElementById("model").value;
            if (!text) return;

            chat.innerHTML += `<div class="msg-wrapper user-wrapper"><div class="msg user">${escapeHtml(text)}</div></div>`;
            input.value = "";

            const botMsgId = "bot-" + Date.now();
            chat.innerHTML += `
                <div class="msg-wrapper bot-wrapper">
                    <div class="msg bot" id="${botMsgId}">Soch raha hoon... 💭</div>
                    <div class="msg-actions" id="actions-${botMsgId}" style="display:none;">
                        <button class="action-btn" onclick="speakText('${botMsgId}')"><i class="fa-solid fa-volume-high"></i></button>
                        <button class="action-btn" onclick="copyText('${botMsgId}')"><i class="fa-solid fa-copy"></i></button>
                    </div>
                </div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, model })
                });
                const data = await res.json();

                const botMsgDiv = document.getElementById(botMsgId);
                if (data.error) {
                    botMsgDiv.innerText = "Error: " + data.error;
                } else {
                    botMsgDiv.innerHTML = formatMarkdown(data.reply);
                    document.getElementById("actions-" + botMsgId).style.display = "flex";
                }
            } catch (e) {
                document.getElementById(botMsgId).innerText = "Network Error: " + e.message;
            }
            chat.scrollTop = chat.scrollHeight;
        }

        let recognition;
        function toggleVoiceInput() {
            const micBtn = document.getElementById("micBtn");
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Voice support nahi hai");
                return;
            }
            if (micBtn.classList.contains("recording")) {
                recognition.stop();
                micBtn.classList.remove("recording");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.onstart = () => micBtn.classList.add("recording");
            recognition.onresult = (e) => {
                document.getElementById("userInput").value = e.results[0][0].transcript;
                micBtn.classList.remove("recording");
            };
            recognition.onerror = recognition.onend = () => micBtn.classList.remove("recording");
            recognition.start();
        }

        function speakText(id) {
            const text = document.getElementById(id).innerText;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'hi-IN';
            window.speechSynthesis.speak(u);
        }

        function copyText(id) {
            navigator.clipboard.writeText(document.getElementById(id).innerText);
            alert("Copied!");
        }

        function clearChat() {
            if (confirm("Chat clear karein?")) {
                document.getElementById("chat").innerHTML = `<div class="msg-wrapper bot-wrapper"><div class="msg bot">Chat clear ho gayi!</div></div>`;
            }
        }

        function formatMarkdown(t) {
            return t.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                    .replace(/\*(.*?)\*/g, '<i>$1</i>');
        }

        function escapeHtml(t) {
            return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
        }
    </script>
</body>
      </html>
